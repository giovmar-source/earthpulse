# Configurazione del deploy su Render (https://render.com).
# Render legge questo file dal repository GitHub e crea il servizio web
# con il backend FastAPI di EarthPulse.
services:
  - type: web
    name: earthpulse-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Token NASA Earthdata per le luci notturne: il valore si inserisce
      # solo nel pannello di Render (Environment), mai nel repository.
      - key: EARTHDATA_TOKEN
        sync: false
      # Credenziali Copernicus Data Space (Sentinel-5P): client OAuth creato
      # nella Dashboard di Sentinel Hub. Valori solo nel pannello di Render.
      - key: CDSE_CLIENT_ID
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false
